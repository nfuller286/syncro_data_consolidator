# SDC sample configuration.
#
# Copy this file to config.yaml and fill in your real values (API keys,
# ScreenConnect settings, etc). config.yaml is gitignored so your secrets
# stay local.
#
# Path values use {{placeholder}} syntax to reference other keys in
# project_paths (e.g. {{data_folder}}) or the project root. These are
# resolved by src/sdc/utils/config_loader.py at load time, not by YAML
# itself, so they must stay quoted (a bare leading "{" would otherwise be
# parsed as YAML flow-mapping syntax).
project_paths:
  project_root: "DO_NOT_EDIT_-_SET_BY_LOADER"
  data_folder: "{{project_root}}/data"
  input_folder: "{{data_folder}}/input"
  output_folder: "{{data_folder}}/output"
  logs_folder: "{{data_folder}}/logs"
  notes_json: "{{input_folder}}/notes_json/notes.json"
  screenconnect_logs: "{{input_folder}}/screenconnect_logs"
  sillytavern_chat_input_folder: "{{input_folder}}/sillytavern_chat"
  syncro_tickets_input_folder: "{{input_folder}}/syncro_tickets"
  sessions_output_folder: "{{output_folder}}/sessions"
  cache_folder: "{{data_folder}}/cache"
  database_file: "{{data_folder}}/sdc.db"

logging:
  log_file_path: "{{logs_folder}}/sdc.log"
  log_level: "INFO"
  log_to_terminal: true

syncro_api:
  base_url: "https://url.syncromsp.com/api/v1"
  api_key: ""
  tickets_endpoint: "/tickets"
  syncro_test_ticket_file: "{{syncro_tickets_input_folder}}/rmm_tickets_response.json"

# Provider/model selection for chat completions. active_provider selects
# which of the sibling blocks below (google_gemini / local_llm) is used;
# see src/sdc/llm/chat_api.py.
llm_provider_config:
  active_provider: "google_gemini"
  google_gemini:
    api_key: ""
    models:
      complex: "gemini-2.5-pro"
      general: "gemini-2.5-flash"
      lightweight: "gemini-2.5-flash-lite"
      embedding: "models/text-embedding-004"
  local_llm:
    base_url: "http://localhost:1234/v1"
    api_key: "NotNeeded"
    models:
      complex: "local-llm-model-for-complex-tasks"
      general: "local-llm-model-for-general-tasks"
      lightweight: "local-llm-model-for-lightweight-tasks"
      embedding: "local-llm-model-for-embeddings"
  default_llm_params:
    temperature: 0.7
    max_tokens: 2048

embedding_config:
  active_provider: "local"
  base_storage_path: "{{cache_folder}}/embeddings"
  providers:
    local:
      model_name: "sentence-transformers/all-MiniLM-L6-v2"
      device: "cpu"
    openai:
      model_name: "text-embedding-3-small"

processing_defaults:
  recursive_sillytavern_scan: true
  syncro_cache_policy: "if_older_than_hours"
  syncro_cache_expiry_hours: 24
  internal_work_customer_id: 0
  sillytavern_session_gap_minutes: 60
  customer_linking_fuzzy_match_threshold: 95
  notes_json_filename: "notes.json"

screenconnect_ingestor:
  mode: "csv"
  api_config:
    base_url: "https://your.screenconnect.instance"
    extension_id: "your-extension-id-here"
    api_key: ""
